<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parchment · Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23EFE7D2'/%3E%3Crect x='5' y='5' width='22' height='22' fill='none' stroke='%23c8a65d' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%231F2A44'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="src/tokens.css">
  <link rel="stylesheet" href="src/app.css">

</head>
<body class="admin">
  <header id="admin-head">
    <span class="wordmark">PARCHMENT</span><span class="sub">Admin · the record table</span>
    <nav>
      <a id="open-sheet" href="#" target="_blank" rel="noopener" class="btn primary hidden">Open the Sheet ↗</a>
      <button id="reload" class="btn">Reload</button>
      <a href="./" class="btn">Back to the map</a>
    </nav>
  </header>
  <main id="admin">
    <section id="left">
      <div id="filters"></div>
      <div id="coverage"></div>
      <div id="tabs"><button data-tab="rows" class="active">Rows</button><button data-tab="problems">Problems</button><button data-tab="places">Find a place</button></div>
      <div id="rows" class="tab"></div>
      <div id="problems-tab" class="tab hidden"></div>
      <div id="places" class="tab hidden"></div>
    </section>
    <section id="right">
      <svg id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Preview"></svg>
      <div id="detail"></div>
    </section>
  </main>
  <div id="problems" class="hidden"></div>
  <script src="admin.js"></script>
</body>
</html>
